<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 视频生产平台</title>
<!-- 主题要在样式表生效前定下来。app.js 是 type=module，要等整页解析完才跑，
     那之前会先按默认主题画一帧——晚上打开就闪一下白。
     规则只有一条：手动选过就听他的，没选过按本机小时（6—18 点算白天）。
     键名和 js/app.js 里写主题的那处是同一个，改一处要改两处。 -->
<script>
(function () {
  var saved = null;
  try { saved = localStorage.getItem('fv.theme'); } catch (e) { /* 禁用本地存储时退回默认 */ }
  var h = new Date().getHours();
  document.documentElement.dataset.theme =
    (saved === 'day' || saved === 'night') ? saved : (h >= 6 && h < 18 ? 'day' : 'night');
})();
</script>
<!-- 标签页与收藏栏的图标。不声明这两行，Safari 会去请求 /favicon.ico，404 之后
     就用标题首字母画一个灰块——收藏栏那个空位是这么来的，不是图坏了。
     指向侧栏在用的那张抠过底的（透明背景，小尺寸下不会带一圈白边），
     不另存副本，免得两处换图换不到一起。 -->
<link rel="icon" type="image/png" href="/img/brand-user-alpha.png">
<link rel="apple-touch-icon" href="/img/brand-user-alpha.png">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<!-- 侧栏图标集：24 视窗、1.7 描边、无填充，颜色跟 currentColor 走。
     放在最前面，nav-item 里用 <use> 引用，改图只改这一处。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-overview" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.6" y="3.6" width="7.2" height="7.2" rx="1.8"/>
    <rect x="13.2" y="3.6" width="7.2" height="7.2" rx="1.8"/>
    <rect x="3.6" y="13.2" width="7.2" height="7.2" rx="1.8"/>
    <rect x="13.2" y="13.2" width="7.2" height="7.2" rx="1.8"/>
  </symbol>
  <symbol id="ic-projects" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 6.6a1.8 1.8 0 0 1 1.8-1.8h3.2l2.2 2.6h7.9a1.8 1.8 0 0 1 1.8 1.8v8.4a1.8 1.8 0 0 1-1.8 1.8H5.3a1.8 1.8 0 0 1-1.8-1.8z"/>
  </symbol>
  <symbol id="ic-assets" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.3 20 7.3v9.4L12 20.7 4 16.7V7.3z"/>
    <path d="M4 7.3 12 11.4l8-4.1"/>
    <path d="M12 11.4v9.3"/>
  </symbol>
  <symbol id="ic-writing" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20.1l1.1-4.2L15.8 5.2a2.2 2.2 0 0 1 3.1 3.1L8.2 19z"/>
    <path d="M14.2 6.8l3 3"/>
  </symbol>
  <symbol id="ic-generate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.4 3.2 6.1 13.3h4.9l-1 7.5 7.3-10.1h-4.9z"/>
  </symbol>
  <symbol id="ic-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10.6v2.8"/>
    <path d="M8 7.6v8.8"/>
    <path d="M12 4.4v15.2"/>
    <path d="M16 8.2v7.6"/>
    <path d="M20 10.6v2.8"/>
  </symbol>
  <symbol id="ic-review" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.2"/>
    <path d="M8.1 12.2 10.9 15l5-5.6"/>
  </symbol>
  <symbol id="ic-knowledge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.4 5.6A2.1 2.1 0 0 1 6.5 3.5H10a3 3 0 0 1 3 3v13.4a2.4 2.4 0 0 0-2.4-2.4H6.5a2.1 2.1 0 0 1-2.1-2.1z"/>
    <path d="M19.6 5.6a2.1 2.1 0 0 0-2.1-2.1H14a3 3 0 0 0-3 3v13.4a2.4 2.4 0 0 1 2.4-2.4h4.1a2.1 2.1 0 0 0 2.1-2.1z"/>
  </symbol>
  <symbol id="ic-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 8.4h8.6"/>
    <path d="M17.4 8.4H20"/>
    <circle cx="14.9" cy="8.4" r="2.3"/>
    <path d="M4 15.6h2.6"/>
    <path d="M11.4 15.6H20"/>
    <circle cx="9.1" cy="15.6" r="2.3"/>
  </symbol>
  <!-- 日/夜切换的两枚图标。汉字"日""夜"缩到 15px 会糊成一团，所以用几何图形。 -->
  <symbol id="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.6 5.6l1.5 1.5M16.9 16.9l1.5 1.5M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5"/>
  </symbol>
  <symbol id="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.2 14.6A8.8 8.8 0 0 1 9.4 3.8 8.8 8.8 0 1 0 20.2 14.6z"/>
  </symbol>
</svg>

<div class="app">

  <!-- 侧栏骨架：导航项由 js/app.js 按 modules.js 生成，改一处即可 -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" role="img" aria-label="平台图标"></span>
      <div class="brand-text">
        <b>视频生产平台</b>
        <span>本地部署 · 2—5 人</span>
      </div>
    </div>
    <!-- 项目切换器挪到顶栏了（v0.33）：这里原来挂一个常驻 <select>，
         而项目名顶栏面包屑本来就显示一遍，等于同一件事摆两处。 -->
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div><span class="dot idle"></span>本地 worker 未接入</div>
      <div><span class="dot idle"></span>常驻模型 关</div>
      <div class="t-dim">队列 未接入</div>
      <div class="t-dim"><span class="kbd">⌘K</span> 快速跳转</div>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div class="topbar-in">
        <!-- 当前项目＝可点击的文字，点开才出菜单。刻意不做成按钮样子（不描边、不上底）：
             它是全站上下文，不是一个动作。下拉箭头常驻，否则没人知道这里能点。 -->
        <div class="crumb">
          <button class="proj-pick" id="proj-pick" type="button"
                  aria-haspopup="listbox" aria-expanded="false" title="切换项目">
            <b id="cur-name">未选择项目</b>
            <svg class="chev" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 4.6 6 7.8 9.2 4.6"/></svg>
          </button>
          <span id="cur-path"></span>
          <div class="proj-menu" id="proj-menu" role="listbox" aria-label="项目列表" hidden></div>
        </div>
        <div class="top-right">
          <!-- 日/夜切换：图标表示"当前是哪套"，title 说"点下去去哪套"。
               放在最左，不挤账户头像。 -->
          <button class="theme-btn" type="button" data-theme-toggle>
            <svg class="i-sun" aria-hidden="true"><use href="#ic-sun"/></svg>
            <svg class="i-moon" aria-hidden="true"><use href="#ic-moon"/></svg>
          </button>
          <span class="pill accent">本地 worker 未接入</span>
          <span class="pill">云端额度 ¥0.00</span>
          <div class="avatar-wrap">
            <button class="avatar" id="user-btn" type="button"
                    aria-haspopup="menu" aria-expanded="false" title="账户">张</button>
            <div class="proj-menu right" id="user-menu" role="menu" hidden></div>
          </div>
        </div>
      </div>
    </header>
    <!-- 视图挂载点：每次切页整体替换 -->
    <div id="view-root"></div>
  </main>
</div>

<div class="palette" id="palette" hidden>
  <div class="pal-box">
    <input id="palette-input" placeholder="跳转到模块…   ↑↓ 选 · Enter 开 · Esc 关">
    <div class="pal-list" id="palette-list"></div>
  </div>
</div>

<!-- 登录闸门：/api/auth/me 返回 401 时盖住整个应用。
     不用跳转页面，因为登录成功后同一份 DOM 直接继续 boot，省一次整页重载。 -->
<div class="gate" id="gate" hidden>
  <!-- 闸门把顶栏整个盖住了，登录前也要能切主题，所以这里再来一枚。
       两枚按钮共用 [data-theme-toggle]，app.js 一次绑完。 -->
  <button class="theme-btn gate-theme" type="button" data-theme-toggle>
    <svg class="i-sun" aria-hidden="true"><use href="#ic-sun"/></svg>
    <svg class="i-moon" aria-hidden="true"><use href="#ic-moon"/></svg>
  </button>
  <form class="gate-card" id="gate-form">
    <div class="gate-brand">
      <span class="brand-mark" role="img" aria-label="平台图标"></span>
      <div class="brand-text"><b>视频生产平台</b><span>本地部署 · 2—5 人</span></div>
    </div>

    <div id="gate-login">
      <!-- 会话过期时也走这个登录框，得有一句"为什么又让我登录"。
           原来只有改密那块有 gate-note，登录框里没有可放话的地方 -->
      <p class="gate-note" id="gate-login-note" hidden></p>
      <label class="modal-label" for="gate-user">用户名</label>
      <input id="gate-user" class="ctl" autocomplete="username" placeholder="用户名">
      <label class="modal-label" for="gate-pass">密码</label>
      <input id="gate-pass" class="ctl" type="password" autocomplete="current-password" placeholder="密码">
      <p class="gate-err" id="gate-err" hidden></p>
      <button class="btn primary gate-btn" id="gate-submit" type="submit">登录</button>
    </div>

    <div id="gate-password" hidden>
      <p class="gate-note" id="gate-note"></p>
      <div id="gate-old-wrap">
        <label class="modal-label" for="gate-old">原密码</label>
        <input id="gate-old" class="ctl" type="password" autocomplete="current-password">
      </div>
      <label class="modal-label" for="gate-new">新密码（至少 6 位）</label>
      <input id="gate-new" class="ctl" type="password" autocomplete="new-password">
      <label class="modal-label" for="gate-new2">再输一次</label>
      <input id="gate-new2" class="ctl" type="password" autocomplete="new-password">
      <p class="gate-err" id="gate-perr" hidden></p>
      <button class="btn primary gate-btn" id="gate-psave" type="submit">改密并进入</button>
      <button class="btn gate-btn" id="gate-pcancel" type="button" hidden>取消</button>
    </div>
  </form>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
