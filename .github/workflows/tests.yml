name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读仓库内容：测试不需要写权限，也不碰仓库里的密钥（测试自带假值）
permissions:
  contents: read

# 同一条分支连续推送时，旧的那次没必要再跑完
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/backend/requirements-dev.txt
            app/backend/constraints.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          # `-c constraints.txt`：把版本收窄到"本机验证过的那一代"。
          # 没有它时 runner 会自己挑最新版，于是"开发机绿、CI 红"变成
          # 依赖版本的锅——那种红最难查，因为它跟代码毫无关系。
          python -m pip install -c constraints.txt \
            -r requirements.txt -r requirements-dev.txt

      # 第 0 道门：静态检查。放在最前面是有意的——它 3 秒出结果、不需要 ffmpeg
      # 与浏览器，而它能抓到的那几类（未定义名、重复字典键、死分支、未用导入）
      # 恰好是"跑起来才炸"或"永远不生效却没人发现"的问题：
      #   * `error_catalog.py` 同一个键定义两次 → 前一份文案永远不生效；
      #   * `test_infra.py` 断言消息里引用未定义变量 → 真失败时抛 NameError；
      #   * `models.py` 的 `else row.keys()` → 死分支。
      # 这三类全都不影响其它用例，测试全绿也发现不了，只有静态检查能兜住。
      - name: 静态检查（ruff）
        run: python -m ruff check --output-format=github .

      # 类型检查：范围只有 `schemas/` 与 `db.py`（见 pyproject.toml 的
      # `[tool.mypy]`）。**不做全量**——全量是上万个错误，只能靠白名单压成
      # "装上了但什么都没查"。这两处今天就是真绿的，所以这一步红了一定是真问题。
      - name: 类型检查（mypy）
        run: python -m mypy

      # 合成与产线的成片节点要真跑 FFmpeg 造产物、真合成、真验时长。
      # runner 默认不带 ffmpeg，所以这两条自 v0.93 起在 CI 上一直红、在开发机上一直绿
      # ——红得"合理"反而把门禁本身废掉了：谁都不再看那条红线。
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1
          # 这两行是"给测试铺的路"，不是打印好看：滤镜列表走 stdout（本机实测 489 行、
          # stderr 空），数到 0 就说明这包 ffmpeg 没带 libass，那"真烧字幕 + PSNR 对照"
          # 那一档会静悄悄少跑一条——本机 Homebrew 正是这档从来没被执行过。
          # 宁可在这里红，别让它变成测试日志里一个没人看的 skip。
          test "$(ffmpeg -hide_banner -filters | grep -c ' subtitles ')" -ge 1
          # fc-list 属于 fontconfig 的命令行包，runner 上不一定装了，所以只在有时确认一次
          # 中文字体在不在；用例烧的是「火／取火」，缺字就什么都不落画，PSNR 变 inf，
          # 红出来会像是"字幕没生效"——那其实是没字体。
          if command -v fc-list >/dev/null 2>&1; then
            test -n "$(fc-list :lang=zh family | head -1)"
          fi

      - name: 全量测试
        # shell: bash 才有 pipefail——默认那层不置管道退出码，pytest 挂了会被 tee 盖成成功
        shell: bash
        # 这里原来设了 FASTVIDEO_TEST_SKIP_ENV=1，用来"两边都跳过环境依赖用例，
        # 基线的 passed 数才不会随 runner 漂"。问题是 ubuntu-latest 删得掉文件，
        # 那 4 条要证的用例（删资产清图、脏清单不卡半套、删资产只清自己登记的图、
        # 缺权重提前失败）因此从没在 CI 上真跑过——用"两边一样地不测"换稳定读数，
        # 是把门禁做成了摆设（2026-11-09 外部审查第 9 条）。
        # 现在只留 conftest.delete_guard 里那段真实探测：删不掉才跳过，
        # 删得掉就必须跑。用例真的因环境跳过时，下面的基线门禁会红。
        run: python -m pytest -q | tee /tmp/pytest.log

      # 第二道门：四份说明书里的测试数／路由数／表数／迁移号，必须与这份代码现算一致。
      # 改了代码没改文档（或反过来）在这里红，不用等人去对数字。
      # 同一道门里还查"路由目录双向一致"：openapi() 的每条业务路由必须在
      # 《系统设计》§11 端点表里，反之亦然（只比总数的话删一条加一条看不出来）。
      # 测试数取自上一步同一次运行的日志，不重复跑第二遍。
      - name: 发布基线门禁
        working-directory: .
        run: python tools/make_release_baseline.py --check --pytest-log /tmp/pytest.log

      # 第三道门：前端 JS 能不能加载。无构建链的项目改完 JS 没有任何本地
      # 解析器兜底，模板字符串被拆断只会在浏览器控制台留一句不带文件名的
      # SyntaxError。这个脚本用 CHROME_BIN 或常见安装位置找浏览器，
      # ubuntu-latest 自带 google-chrome。
      - name: 前端 JS 加载检查
        working-directory: .
        run: python tools/js_load_check.py

      - name: 编辑状态与提交标识回归
        working-directory: .
        run: python tools/editor_state_browser_check.py

      - name: 引擎选择与启动等待回归
        working-directory: .
        run: python tools/engine_setup_browser_check.py

      # 第四道门：三套真浏览器验收。它们起真实服务 + 无头 Chrome，
      # 量的是"页面真的能点、数字与服务端一致"，不是只 import 一下。
      # 此前只在本机跑，所以本轮 4 个前端问题都是手点才发现的。
      # 干净 runner 上没有现役库，脚本会从迁移起一个并建 superadmin
      # （tools/_harness.py 的 prepare_backend_db）。
      - name: 真浏览器验收（智能体中心）
        working-directory: .
        run: python tools/agents_browser_check.py

      - name: 真浏览器验收（模型中心）
        working-directory: .
        run: python tools/model_center_browser_check.py

      - name: 真浏览器验收（产线／生成／工作台）
        working-directory: .
        run: python tools/production_browser_check.py

      # 第五道门：文档自己的结构。目录、锚点、修订速览、跨册引用、历史不丢、图有没有孤儿，
      # 全是"写完没人回头对"的那类账——规矩只有挂在 CI 上才算立住（《写作与引用规范》§11）。
      - name: 文档结构门禁
        working-directory: .
        run: python tools/doc_structure_check.py
