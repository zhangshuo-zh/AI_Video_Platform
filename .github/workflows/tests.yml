name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读仓库内容：测试不需要写权限，也不碰仓库里的密钥（测试自带假值）
permissions:
  contents: read

# 同一条分支连续推送时，旧的那次没必要再跑完
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/backend/requirements-dev.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 全量测试
        # shell: bash 才有 pipefail——默认那层不置管道退出码，pytest 挂了会被 tee 盖成成功
        shell: bash
        run: python -m pytest -q | tee /tmp/pytest.log

      # 第二道门：四份说明书里的测试数／路由数／表数／迁移号，必须与这份代码现算一致。
      # 改了代码没改文档（或反过来）在这里红，不用等人去对数字。
      # 测试数取自上一步同一次运行的日志，不重复跑第二遍。
      - name: 发布基线门禁
        working-directory: .
        run: python tools/make_release_baseline.py --check --pytest-log /tmp/pytest.log
